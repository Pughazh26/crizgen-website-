<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Rounded Tile -->
  <rect width="64" height="64" rx="16" fill="#090d16" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  
  <!-- Stylized Geometric 'C' Logo -->
  <path d="M42 22 C37 17, 27 17, 22 22 C16 28, 16 36, 22 42 C27 47, 37 47, 42 42" 
        fill="none" 
        stroke="url(#cgGrad)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#shadow)" />
  
  <!-- Glowing Accent Dot -->
  <circle cx="44" cy="32" r="3.5" fill="#38bdf8" />
</svg>
